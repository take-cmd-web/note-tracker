name: Daily Note Stats

on:
  schedule:
    # 毎日 日本時間 9:00 (UTC 0:00) に実行
    - cron: '0 0 * * *'
  workflow_dispatch:  # 手動実行も可能にする

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # CSVを書き戻すのに必要

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        env:
          NOTE_USERNAME: ${{ secrets.NOTE_USERNAME }}
          NOTE_COOKIE: ${{ secrets.NOTE_COOKIE }}
        run: python note_tracker.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/
          git diff --quiet && git diff --staged --quiet || git commit -m "Update stats $(date +'%Y-%m-%d')"
          git push
