name: Daily Note Stats
on:
  schedule:
    # 毎日 日本時間 9:00 (UTC 0:00) に実行
    - cron: '0 0 * * *'
  workflow_dispatch:  # 手動実行も可能にする

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # CSVを書き戻すのに必要
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        id: tracker
        env:
          NOTE_USERNAME: ${{ secrets.NOTE_USERNAME }}
          NOTE_COOKIE: ${{ secrets.NOTE_COOKIE }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: python note_tracker.py

      - name: Commit results
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/
          if git diff --quiet && git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Update stats $(date +'%Y-%m-%d')"
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Warn if no data change
        if: steps.commit.outputs.changed == 'false'
        run: |
          echo "::warning::CSVが更新されませんでした。NOTE_COOKIEが失効した可能性があります。Secretsを更新してください。"
          exit 1
